name: questrace_flutter
description: 题迹 Questrace mobile client built with Flutter.
publish_to: "none"

version: 2.1.2+21200

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  device_info_plus: ^11.2.1
  flutter_math_fork:
    path: third_party/flutter_math_fork
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.0
  material_color_utilities: ^0.13.0
  image_picker: ^1.1.2
  open_filex: ^4.0.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  nsd: ^5.0.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - config/
